name: Deploy App

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy-app.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: web → production
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Write the web env file
        env:
          GOOGLE_SIGN_IN_CLIENT_ID: ${{ vars.GOOGLE_SIGN_IN_CLIENT_ID }}
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          BACKEND_SERVICE_ACCOUNT: ${{ vars.BACKEND_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SIGN_IN_CLIENT_ID:-}" ] || [ -z "${PROJECT_ID:-}" ] || [ -z "${BACKEND_SERVICE_ACCOUNT:-}" ]; then
            echo "Error: GOOGLE_SIGN_IN_CLIENT_ID, PROJECT_ID, and BACKEND_SERVICE_ACCOUNT must be set as repository variables."
            exit 1
          fi
          mkdir -p app/env
          cat > app/env/web.json <<JSON
          {
            "GOOGLE_SIGN_IN_CLIENT_ID": "${GOOGLE_SIGN_IN_CLIENT_ID}",
            "PROJECT_ID": "${PROJECT_ID}",
            "BACKEND_SERVICE_ACCOUNT": "${BACKEND_SERVICE_ACCOUNT}",
            "API_BASE_URL": "/api/",
            "FLAVOR": "production"
          }
          JSON

      - name: Build Flutter web app
        run: |
          cd app
          flutter pub get
          flutter build web \
            --release \
            --dart-define-from-file env/web.json

      - name: Connect to the Pi
        uses: ./.github/actions/pi-ssh
        with:
          ssh-private-key: ${{ secrets.PI_SSH_PRIVATE_KEY }}
          tunnel-token-id: ${{ secrets.TUNNEL_SERVICE_TOKEN_ID }}
          tunnel-token-secret: ${{ secrets.TUNNEL_SERVICE_TOKEN_SECRET }}
          pi-user: ${{ vars.PI_USER }}
          pi-host: ${{ vars.PI_HOST }}

      - name: Deploy to the Pi
        env:
          PI_REPO_PATH: ${{ vars.PI_REPO_PATH }}
        run: |
          set -euo pipefail
          ssh focus-pi 'mkdir -p /opt/focus/web'
          rsync -avz --delete app/build/web/ focus-pi:/opt/focus/web/
          ssh focus-pi "PI_REPO_PATH='${PI_REPO_PATH}' bash -s -- web" \
            < server/deploy/pi-deploy.sh
