name: Deploy image

# Reusable: builds one Node service as an ARM64 image, ships it to the Pi and
# restarts it. Called by deploy-server.yml and deploy-agent.yml.
on:
  workflow_call:
    inputs:
      component:
        description: backend | agent
        type: string
        required: true

jobs:
  deploy:
    name: ${{ inputs.component }} → production
    runs-on: ubuntu-24.04-arm
    environment: production
    concurrency:
      group: deploy-${{ inputs.component }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    env:
      CONTEXT: ${{ inputs.component == 'backend' && 'server' || 'agent' }}
      IMAGE: focus-${{ inputs.component }}:latest
      ARCHIVE: focus-${{ inputs.component }}.tar.gz
      VERSION: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for ARM64
        uses: docker/build-push-action@v5
        with:
          context: ./${{ env.CONTEXT }}
          file: ./${{ env.CONTEXT }}/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          build-args: FOCUS_VERSION=${{ env.VERSION }}
          cache-from: type=gha,scope=${{ inputs.component }}
          cache-to: type=gha,mode=max,scope=${{ inputs.component }}

      - name: Save image to archive
        run: |
          set -euo pipefail
          docker save "$IMAGE" | gzip > "$ARCHIVE"
          ls -lh "$ARCHIVE"

      - name: Connect to the Pi
        uses: ./.github/actions/pi-ssh
        with:
          ssh-private-key: ${{ secrets.PI_SSH_PRIVATE_KEY }}
          tunnel-token-id: ${{ secrets.TUNNEL_SERVICE_TOKEN_ID }}
          tunnel-token-secret: ${{ secrets.TUNNEL_SERVICE_TOKEN_SECRET }}
          pi-user: ${{ vars.PI_USER }}
          pi-host: ${{ vars.PI_HOST }}

      - name: Deploy on the Pi
        env:
          PI_REPO_PATH: ${{ vars.PI_REPO_PATH }}
        run: |
          set -euo pipefail
          scp "$ARCHIVE" "focus-pi:/tmp/$ARCHIVE"
          ssh focus-pi "PI_REPO_PATH='${PI_REPO_PATH}' bash -s -- '${{ inputs.component }}' '$VERSION'" \
            < server/deploy/pi-deploy.sh
