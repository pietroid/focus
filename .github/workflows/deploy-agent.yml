name: Deploy Agent

on:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - '.github/workflows/deploy-agent.yml'
      - '.github/workflows/deploy-image.yml'
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy-image.yml
    with:
      component: agent
    secrets: inherit
