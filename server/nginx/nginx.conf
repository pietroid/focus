server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Flutter web app: serve static files and fall back to index.html for
    # client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy: forward /api/* requests to the NestJS backend container.
    # The trailing slash on both paths strips the /api/ prefix before
    # forwarding, so /api/threads becomes /threads on the backend.
    location /api/ {
        proxy_pass http://focus-backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
